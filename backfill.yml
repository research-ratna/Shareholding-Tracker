name: Backfill investor history

# Manual trigger only - NOT on a schedule. This walks every available
# quarter (not just the latest) across the FULL symbol universe on the
# investor side, which is much more expensive than the daily scan. It's
# idempotent (skips symbol+quarter pairs already processed via
# sht_processed_filings), so if it doesn't finish inside the timeout
# below, just re-run it from the Actions tab and it picks up where it
# left off rather than starting over.
#
# The company watchlist doesn't need this - run.py always fetches full
# history for it (see scrape.yml), since that list is small.
on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GitHub Actions caps a single job at 6h regardless
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Run backfill
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python run.py --backfill
